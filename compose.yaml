name: inspector-watt

# Each service of ours has a published image (./dc pull) and its source (./dc up -d --build builds it here
# instead). The database is the stock TimescaleDB image; the api creates and migrates the schema.
# IMAGE_TAG picks a version (e.g. 1.2); the simulator stack uses its own tag so its builds stay apart.

x-database-url: &database-url postgresql://tracker:${DB_PASSWORD:-tracker}@db:5432/tracker

services:
  db:
    image: docker.io/timescale/timescaledb:2.30.2-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tracker}
      TS_TUNE_MEMORY: 1GB  # don't let timescaledb-tune claim a quarter of the machine
      TS_TUNE_NUM_CPUS: "2"
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"  # for psql / DuckDB / Grafana from this machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  capture:
    image: ghcr.io/mcpijnappel/inspector-watt-capture:${IMAGE_TAG:-latest}
    build:
      context: ./capture
      target: runtime
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"  # files in ./data belong to you; device ACLs are granted to this uid
    environment:
      PPK2_PORT: ${PPK2_PORT:-/host-dev/ppk2}
      UART_PORT: ${UART_PORT:-/host-dev/dut-uart}
      USB_PORT: ${USB_PORT:-/host-dev/dut-usb}  # the DUT's own USB (console + flashing); opened only on demand
      UART_BAUD: ${UART_BAUD:-115200}
      RING_SECONDS: ${RING_SECONDS:-300}
      MAX_VOLTAGE_MV: ${MAX_VOLTAGE_MV:-4200}  # XIAO ESP32-C6 battery input: 1-cell LiPo, max 4.2 V
      IDLE_POWER_OFF_S: ${IDLE_POWER_OFF_S:-600}  # DUT off after this long with no browser open and nothing recording; 0 = never
      DATABASE_URL: *database-url
      DATA_DIR: /data
      MIN_FREE_GB: ${MIN_FREE_GB:-10}
      RAW_MANTISSA_BITS: ${RAW_MANTISSA_BITS:-12}  # raw precision; 23 = lossless (~40 % bigger)
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The whole host /dev is mounted (not just the device nodes), so the udev symlinks /dev/ppk2 and
    # /dev/dut-uart keep working after a replug renumbers ttyACM*. The cgroup rules allow only USB CDC ACM
    # serial devices (major 166) and raw USB devices (major 189: picotool flashing an RP2040/RP2350 in its
    # boot loader; libusb looks for them under /dev/bus/usb, so that's mounted where it looks).
    volumes:
      - /dev:/host-dev:ro
      - /dev/bus/usb:/dev/bus/usb:ro
      - ${DATA_DIR:-./data}:/data:z
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 189:* rmw"
    security_opt:
      - label=disable  # SELinux: let the container open the host's tty devices
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy  # the api creates the schema (migrations) before capture reads it
    ports:
      - "127.0.0.1:${CAPTURE_PORT:-8100}:8100"  # debugging; the api service is the normal entry point

  api:
    image: ghcr.io/mcpijnappel/inspector-watt-api:${IMAGE_TAG:-latest}
    build:
      context: ./api
      target: runtime
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: *database-url
      CAPTURE_URL: http://capture:8100
      DATA_DIR: /data
      MCP_URL: http://mcp:8300
      MCP_TOKEN: ${MCP_TOKEN:-}  # only the first time: LAN access for agents is then managed in Settings → Agents
      FLASH_TOKEN: ${FLASH_TOKEN:-}  # only the first time: the upload token (random if empty)
      OTA_PUBLIC_PORT: ${OTA_PORT:-3232}  # shown in Settings → Firmware upload (inside, it's always 3232)
    volumes:
      - ${DATA_DIR:-./data}:/data:z
    depends_on:
      db:
        condition: service_healthy
    healthcheck:  # healthy once the migrations ran
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
      # Arduino OTA endpoint (PlatformIO upload_protocol = espota): where the web port is, unless OTA_BIND says
      # otherwise. The upload token is its password. It connects back to the uploading machine over TCP.
      - "${OTA_BIND:-${WEB_BIND:-127.0.0.1}}:${OTA_PORT:-3232}:3232/udp"

  # Agents (MCP): analyse sessions, read live data, edit phase rules; no hardware control. On this machine at
  # http://localhost:8300/mcp; on the LAN through the web port (/mcp) with the token from Settings → Agents.
  mcp:
    image: ghcr.io/mcpijnappel/inspector-watt-mcp:${IMAGE_TAG:-latest}
    build:
      context: ./mcp-server
      target: runtime
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:${MCP_PORT:-8300}:8300"

  web:
    image: ghcr.io/mcpijnappel/inspector-watt-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      additional_contexts:
        tools: ./tools  # pst_flash.py, the upload client, offered as a download (Settings → Firmware upload)
    restart: unless-stopped
    depends_on:
      - api
      - capture
      - mcp
    # No login: anyone who can reach this port can control the PPK2. WEB_BIND=0.0.0.0 opens it to the network.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
