[project]
name = "pst-mcp"
version = "0.1.0"
description = "MCP server for Inspector Watt: analyse sessions, read live data, edit phase rules (no hardware control)"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.27.2",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
