[project]
name = "api"
version = "0.1.0"
description = "History + control API for Inspector Watt"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.1",
    "pyarrow>=20",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"api.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
