server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Firmware uploads from PlatformIO: base64 images of up to 16 MB
    location = /api/flash {
        proxy_pass http://api:8000;
        client_max_body_size 32m;
        proxy_read_timeout 120s;
    }

    # Modules send their events to the api directly (api:8000), never through here.
    location ~ ^/api/modules/[^/]+/events$ {
        return 403;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
    }

    # Live stream straight from the capture service: /ws/live -> capture /live (only that: everything else on
    # capture goes through the api, which checks the flash token)
    location = /ws/live {
        proxy_pass http://capture:8100/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # MCP for agents on the LAN: the mcp service asks for its token on requests that come this way.
    location /mcp {
        proxy_pass http://mcp:8300;
        proxy_set_header Host mcp;
        proxy_set_header X-PST-Via web;
        proxy_set_header X-Real-IP $remote_addr;  # which machine an agent asks from (hardware-control banner)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # behind a reverse proxy: the agent's own address first
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # pst_flash.py, the upload client (from tools/ at build time): always a download, never cached.
    location /downloads/ {
        default_type text/x-python;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
